name: GitHub Gravity
description: Generate an animated SVG of your GitHub contribution graph falling under gravity, with custom text as collision obstacles.
author: flycran

branding:
  icon: git-pull-request
  color: green

inputs:
  username:
    description: GitHub username to fetch contributions for
    required: true
  text:
    description: Text to display as collision obstacles (defaults to username)
    required: false
  output-path:
    description: Path to write the generated SVG file
    required: false
    default: gravity.svg
  font-size:
    description: Font size of the collision text
    required: false
    default: '48'
  compression-tolerance:
    description: >-
      Trajectory compression tolerance in SVG pixels. At every original moment of the
      animation, the interpolated position stays within this distance of the real one,
      which shrinks the SVG at the cost of a small visual approximation. 0 keeps the
      trajectory lossless in both position and timing (only uniform straight segments
      and pauses are compressed); the default fits most cases.
    required: false
    default: '0.5'
  compression-algorithm:
    description: >-
      Trajectory compression algorithm: Greedy (default) is fast with near-optimal
      results; DP finds the globally fewest keyframes (smallest SVG) but can take
      seconds on long trajectories; RDP is the fastest with somewhat more keyframes.
      All algorithms preserve speed and timing — bounces and stops stay keyframes.
    required: false
    default: Greedy
  max-simulation-time:
    description: >-
      Maximum simulation time in seconds, counted as animation playback duration:
      the simulated time is this value multiplied by the playback speed. When reached,
      the simulation stops and the trajectory simulated so far is returned instead of
      waiting for every block to settle. Leave empty to simulate until all blocks rest.
    required: false
  shape:
    description: Shape of the contribution blocks (circle or square). Circle has smoother physics and less likely to clip through obstacles.
    required: false
    default: circle
  text-top:
    description: Distance from the top of the world to the text (controls vertical text position)
    required: false
    default: '50'
  background-color:
    description: Background color of the SVG (CSS color value)
    required: false
    default: transparent
  text-color:
    description: Color of the collision text (CSS color value)
    required: false
    default: black
  scale:
    description: >-
      Display zoom factor: the SVG width and height attributes are the physics
      dimensions multiplied by it, while the viewBox keeps the raw physics size.
    required: false
    default: '3'
  speed:
    description: >-
      Playback speed multiplier: the animation duration is the simulated time
      divided by it.
    required: false
    default: '3'
  css:
    description: >-
      Use the CSS animation engine (a self-contained style block with @keyframes,
      animations bound via data-date selectors) instead of SMIL animateTransform.
      Both stay a single static SVG file; CSS plays more reliably in environments
      with poor SMIL support, and stays visually identical. Default: false.
    required: false
    default: 'false'
  animation:
    description: >-
      Custom CSS animation value applied to every block. Only effective with css: true.
      Default: var(--n) var(--dur) linear both. Available variables: --n is the
      block's keyframes name, --dur is the playback duration. Modify with caution:
      a wrong value breaks the animation effect. Must not contain braces,
      semicolons or "]]>".
    required: false
  width:
    description: >-
      Width of the physics world. Change with caution: the horizontal block layout, the text
      centering and the final SVG width are all derived from it.
    required: false
    default: '300'
  height:
    description: >-
      Height of the physics world. Change with caution: the block drop height, the text
      position and the final SVG height are all derived from it.
    required: false
    default: '150'
  size:
    description: >-
      Side length of each contribution block. Change with caution: larger blocks are more
      likely to squeeze against each other or clip through the text.
    required: false
    default: '4'
  interval:
    description: >-
      Spacing between contribution blocks. Change with caution: too small makes blocks overlap,
      too large pushes them out of the world bounds.
    required: false
    default: '1.5'
  font-path:
    description: >-
      Path to a custom font (.ttf/.otf), relative to the repository root, or an http(s) URL.
      Defaults to the bundled Liberation Serif Bold. Use with caution: some fonts contain open
      or self-intersecting contours that the triangulation algorithm rejects, and some cannot
      be parsed by opentype.js at all; different font metrics may also require re-tuning
      font-size and text-top.
    required: false

outputs:
  svg-path:
    description: Path to the generated SVG file

runs:
  using: node24
  main: dist/index.js
