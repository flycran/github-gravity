name: GitHub Gravity
description: Generate an animated SVG of your GitHub contribution graph falling under gravity, with custom text as collision obstacles.
author: flycran

branding:
  icon: git-pull-request
  color: green

inputs:
  username:
    description: GitHub username to fetch contributions for
    required: true
  text:
    description: Text to display as collision obstacles (defaults to username)
    required: false
  output-path:
    description: Path to write the generated SVG file
    required: false
    default: gravity.svg
  font-size:
    description: Font size of the collision text
    required: false
    default: '48'
  compression-tolerance:
    description: >-
      Trajectory compression tolerance in SVG coordinate units (user units; one
      unit spans scale on-screen pixels). At every original moment of the
      animation, the interpolated position stays within this distance of the real one
      (per axis with the CSS engine, combined offset with SMIL), which shrinks the SVG
      at the cost of a small visual approximation. 0 keeps the trajectory lossless in
      both position and timing (only uniform straight segments and pauses are
      compressed).
    required: false
    default: '0.5'
  compression-algorithm:
    description: >-
      Trajectory compression algorithm: Greedy is fast with near-optimal
      results; DP finds the globally fewest keyframes (smallest SVG) but can take
      seconds on long trajectories; RDP is the fastest with somewhat more keyframes.
      All algorithms preserve speed and timing — bounces and stops stay keyframes.
    required: false
    default: Greedy
  max-simulation-time:
    description: >-
      Maximum animation playback duration in seconds. Once the animation reaches
      it, blocks freeze where they are instead of waiting for every block to
      settle. Leave empty to play until all blocks rest.
    required: false
  shape:
    description: Shape of the contribution blocks (circle or square).
    required: false
    default: circle
  text-top:
    description: Distance from the top of the world to the text (controls vertical text position)
    required: false
    default: '50'
  background-color:
    description: Background color of the SVG (CSS color value)
    required: false
    default: transparent
  text-color:
    description: Color of the collision text (CSS color value)
    required: false
    default: black
  scale:
    description: >-
      Overall zoom applied to the final SVG. It does not change the actual
      size of the physics world.
    required: false
    default: '3'
  speed:
    description: >-
      Playback speed multiplier: the higher the value, the faster the
      animation plays.
    required: false
    default: '3'
  css:
    description: >-
      Render the animation with CSS animation (the only engine the animation
      input works with) instead of SMIL animateTransform.
      Both stay a single static SVG file; CSS plays more reliably in environments
      with poor SMIL support, and stays visually identical.
    required: false
    default: 'false'
  animation:
    description: >-
      Custom CSS animation value applied to every block. Only effective with css: true.
      Default: var(--n) var(--dur) linear both. Applied once per axis (x, y and
      rotation), with var(--n) replaced by that axis' keyframes name. Available
      variables: --n is the per-axis keyframes name placeholder, --dur is the playback
      duration. Modify with caution: a wrong value breaks the animation effect. Must
      not contain braces, semicolons or "]]>".
    required: false
  width:
    description: >-
      Width of the physics world. Change with caution: the horizontal block layout, the text
      centering and the final SVG width are all derived from it.
    required: false
    default: '300'
  height:
    description: >-
      Height of the physics world. Change with caution: the block drop height, the text
      position and the final SVG height are all derived from it.
    required: false
    default: '150'
  size:
    description: >-
      Side length of each contribution block. Change with caution: too large
      pushes the block matrix out of the world bounds.
    required: false
    default: '4'
  interval:
    description: >-
      Spacing between contribution blocks. Change with caution: too large
      pushes the block matrix out of the world bounds.
    required: false
    default: '1.5'
  friction:
    description: >-
      Friction coefficient of the contribution blocks.
    required: false
    default: '0.3'
  restitution:
    description: >-
      Restitution (bounciness) of the contribution blocks. Values far from 0
      may fling blocks out of the visible area.
    required: false
    default: '0'
  font-path:
    description: >-
      Path to a custom font (.ttf/.otf), relative to the repository root, or an http(s) URL.
      Defaults to the bundled Liberation Serif Bold. Use with caution: some fonts contain open
      or self-intersecting contours that the triangulation algorithm rejects, and some cannot
      be parsed by opentype.js at all.
    required: false
  token:
    description: >-
      Optional GitHub token. When this input is set, or GITHUB_TOKEN is present
      in the environment, contributions are fetched from the official GraphQL
      API; otherwise the public gh-calendar API is used as a fallback.
      Pass `secrets.GITHUB_TOKEN` from the workflow.
    required: false

outputs:
  svg-path:
    description: Path to the generated SVG file

runs:
  using: node24
  main: dist/index.js
