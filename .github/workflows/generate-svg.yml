name: Daily Gravity SVG

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 0:00 运行（北京时间 8:00）
    - cron: '0 0 * * *'
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-and-deploy:
    name: Generate SVG & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install Dependencies
        run: bun ci

      - name: Bundle
        run: npm run bundle

      - uses: ./
        with:
          username: "Orta"
          text: "Github Gravity"
          shape: "square"
          text-color: "#eb510a"
          css: true
          max-simulation-time: 10
          font-size: 32
          text-top: 56
          friction: 0.1
          restitution: 0.3

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: output
          keep_files: false
          force_orphan: true
