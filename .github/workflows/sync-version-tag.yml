name: Sync Version Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: sync-version-tag
  cancel-in-progress: false

jobs:
  sync-version-tag:
    name: Sync Version Tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # package.json 是版本号唯一事实源：main 上的 version 没有对应 tag 时自动补打，
      # 并把大版本 tag（v3.3.3 -> v3）移到同一提交；已存在则跳过，幂等可重跑。
      # major tag 必须在这里一并更新：GITHUB_TOKEN 的 push 不会触发其他 workflow，
      # 单独的 tag-push 工作流永远等不到事件
      - name: Create tags if missing
        id: create-tags
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          MAJOR="${VERSION%%.*}"

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "$VERSION already exists, nothing to do"
            exit 0
          fi

          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"

          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "$MAJOR"

          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major-tag=$MAJOR" >> "$GITHUB_OUTPUT"
