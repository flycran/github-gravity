<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVG 视觉对比</title>
    <style>
      :root {
        --border: #d0d7de;
        --bg: #f6f8fa;
        --fg: #1f2328;
        --accent: #0969da;
        --danger: #d9480f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--fg);
        background: #fff;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
      }
      header h1 { font-size: 16px; margin: 0; }
      .ref-badge { font-size: 12px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 12px; }
      .ref-badge[data-side='a'] { border-color: #0969da; }
      .ref-badge[data-side='b'] { border-color: #d9480f; }
      header .spacer { flex: 1; }
      button, select {
        font: inherit;
        padding: 4px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: var(--bg); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      button.primary:hover:not(:disabled) { background: #0757ba; }
      .view-label { font-size: 13px; color: #57606a; }
      /* 视图模式用单选组：比下拉少一次点击 */
      #view { display: flex; gap: 10px; border: 0; margin: 0; padding: 0; }
      #view label {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        cursor: pointer;
      }
      #view input { accent-color: var(--accent); margin: 0; }
      .opacity-wrap { display: none; align-items: center; gap: 6px; font-size: 13px; }
      body[data-view='overlay'] .opacity-wrap,
      body[data-view='difference'] .opacity-wrap { display: flex; }

      main { padding: 16px; }
      /* 并排：两列各占一半可用宽度；pane 高度由 SVG 的 viewBox 比例自动撑开 */
      #stage {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        width: 100%;
      }
      .pane {
        position: relative;
        width: 100%;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .pane svg { display: block; width: 100%; height: auto; }
      .pane-label {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 2;
        font-size: 12px;
        padding: 1px 8px;
        border-radius: 10px;
        color: #fff;
      }
      /* 叠加 / difference 下画面重合，A/B 角标失去意义（低特异性规则前置避免降序警告） */
      body[data-view='overlay'] .pane-label,
      body[data-view='difference'] .pane-label { display: none; }
      #pane-a .pane-label { background: #0969da; }
      #pane-b .pane-label { background: #d9480f; }

      /* 叠加 / difference：两个 pane 重叠在同一格，居中且与并排同尺寸（切换不跳变）；
         画面重合后 A/B 角标失去意义，隐藏；B 的不透明度由脚本统一管理 */
      body[data-view='overlay'] #stage,
      body[data-view='difference'] #stage {
        grid-template-columns: minmax(0, 1fr);
        justify-items: center;
      }
      body[data-view='overlay'] .pane,
      body[data-view='difference'] .pane {
        grid-area: 1 / 1;
        width: min(100%, calc(50vw - 40px));
      }
      body[data-view='difference'] #pane-b svg { mix-blend-mode: difference; }

      footer {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-top: 1px solid var(--border);
        background: var(--bg);
      }
      #progress { flex: 1; }
      #time-label { font-size: 13px; font-variant-numeric: tabular-nums; min-width: 110px; }

      #report-panel { padding: 0 16px 24px; }
      #report-panel:empty { display: none; }
      #report-panel h2 { font-size: 15px; }
      .verdict .dim-grid { display: flex; gap: 12px; flex-wrap: wrap; }
      .dim-card {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        min-width: 140px;
      }
      .dim-card.pass { border-color: #1a7f37; }
      .dim-card.fail { border-color: var(--danger); background: #fff5ee; }
      .dim-card .dim-name { font-size: 12px; color: #57606a; }
      .dim-card small { color: #57606a; }
      .peak { font-size: 13px; color: #57606a; }
      #report-panel table { border-collapse: collapse; font-size: 13px; width: 100%; }
      #report-panel th, #report-panel td { border: 1px solid var(--border); padding: 4px 8px; text-align: right; }
      #report-panel tbody tr { cursor: pointer; }
      #report-panel tbody tr.active { background: #ddf4ff; }
      .frame-viewer { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
      .frame-viewer figure { margin: 0; text-align: center; }
      .frame-viewer img { max-width: 320px; width: 100%; border: 1px solid var(--border); }
      .frame-viewer figcaption { font-size: 12px; color: #57606a; }
    </style>
  </head>
  <body data-view="side">
    <header>
      <h1>SVG 视觉对比</h1>
      <span class="ref-badge" data-side="a" id="ref-a">A</span>
      <span class="ref-badge" data-side="b" id="ref-b">B</span>
      <span class="view-label">视图</span>
      <fieldset id="view">
        <label><input type="radio" name="view" value="side" checked />并排</label>
        <label><input type="radio" name="view" value="overlay" />叠加</label>
        <label><input type="radio" name="view" value="difference" />difference</label>
      </fieldset>
      <label class="opacity-wrap">
        B 不透明度
        <input type="range" id="opacity" min="0" max="1" step="0.01" value="0.5" />
        <span id="opacity-label">0.50</span>
      </label>
      <span class="spacer"></span>
      <span id="combo-label" class="view-label"></span>
      <button class="primary" id="report-btn" type="button">生成一致性报告</button>
    </header>

    <main>
      <div id="stage">
        <div class="pane" id="pane-a"><span class="pane-label">A</span></div>
        <div class="pane" id="pane-b"><span class="pane-label">B</span></div>
      </div>
    </main>

    <footer>
      <button id="play" type="button">播放</button>
      <button id="step-back" type="button" title="后退一帧">◀</button>
      <input type="range" id="progress" min="0" max="0" step="1" value="0" />
      <button id="step-forward" type="button" title="前进一帧">▶</button>
      <span id="time-label">0.00s / 0.00s</span>
    </footer>

    <div id="report-panel"></div>
    <script type="module" src="./previewPage.ts"></script>
  </body>
</html>
